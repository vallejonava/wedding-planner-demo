<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<title>TV Remote · T&J</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{min-height:100%;background:#c8bfb0;display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1rem 3rem;font-family:'DM Sans',sans-serif}

.remote{
  width:100%;max-width:340px;
  background:linear-gradient(175deg,#1c1c1e 0%,#111113 60%,#0d0d0f 100%);
  border-radius:44px 44px 36px 36px;
  padding:1.6rem 1.4rem 2.2rem;
  box-shadow:
    0 2px 0 rgba(255,255,255,.06) inset,
    0 -2px 0 rgba(0,0,0,.6) inset,
    0 30px 80px rgba(0,0,0,.45),
    0 8px 20px rgba(0,0,0,.3);
  position:relative;
  border:1px solid rgba(255,255,255,.05);
}
.remote::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);
  pointer-events:none;
}

/* OLED display */
.display{
  background:#050507;border-radius:14px;padding:1rem 1.1rem .85rem;
  margin-bottom:1.4rem;border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.8);position:relative;overflow:hidden;
}
.display::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.03) 0%,transparent 60%);pointer-events:none}
.disp-eyebrow{font-size:.52rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(196,147,63,.6);margin-bottom:.3rem;font-family:'IBM Plex Mono',monospace}
.disp-scene{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:300;color:#fff;line-height:1;margin-bottom:.4rem}
.disp-scene em{font-style:italic;color:#d4a84f}
.disp-row{display:flex;justify-content:space-between;align-items:center}
.disp-stat{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:rgba(255,255,255,.3);letter-spacing:.06em}
.disp-live{display:flex;align-items:center;gap:.3rem;font-family:'IBM Plex Mono',monospace;font-size:.52rem;color:#4ade80;letter-spacing:.15em}
.live-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:blink 1.6s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.section-label{font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.2);font-family:'IBM Plex Mono',monospace;margin:.2rem 0 .7rem .1rem}

/* Scene buttons */
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.2rem}
.scene-btn{
  background:linear-gradient(170deg,#242428,#1a1a1e);
  border:1px solid rgba(255,255,255,.07);border-radius:14px;
  padding:.85rem .6rem .75rem;color:rgba(255,255,255,.55);cursor:pointer;
  transition:all .12s ease;
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  position:relative;overflow:hidden;
}
.scene-btn:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.scene-btn.active{
  background:linear-gradient(170deg,#1e3a3f,#152a2e);
  border-color:rgba(74,157,173,.5);color:#fff;
  box-shadow:0 3px 12px rgba(42,110,124,.3),inset 0 1px 0 rgba(74,157,173,.15);
}
.sb-icon{font-size:1.3rem;line-height:1}
.sb-name{font-size:.65rem;font-weight:600;letter-spacing:.04em;line-height:1}
.sb-sub{font-size:.52rem;color:rgba(255,255,255,.3);letter-spacing:.04em}
.scene-btn.active .sb-sub{color:rgba(74,157,173,.7)}

/* Nav */
.nav-row{display:flex;gap:.65rem;margin-bottom:1.3rem}
.nav-btn{
  flex:1;background:linear-gradient(170deg,#242428,#1a1a1e);
  border:1px solid rgba(255,255,255,.07);border-radius:13px;
  padding:.75rem .5rem;color:rgba(255,255,255,.55);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  transition:all .12s;letter-spacing:.04em;
}
.nav-btn:active{transform:translateY(2px);background:rgba(42,110,124,.18);border-color:rgba(74,157,173,.4);color:#4a9dad}

.phy-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);margin:1.2rem 0}

/* Autoplay */
.autoplay-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.ap-label{font-size:.75rem;font-weight:500;color:rgba(255,255,255,.5)}
.toggle{position:relative;width:46px;height:26px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.tgl-track{position:absolute;inset:0;border-radius:13px;background:rgba(255,255,255,.1);transition:background .25s;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.toggle input:checked+.tgl-track{background:#16a34a;box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 0 8px rgba(22,163,74,.3)}
.tgl-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#fff,#ddd);transition:transform .22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 5px rgba(0,0,0,.5)}
.toggle input:checked~.tgl-thumb{transform:translateX(20px)}
.interval-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1.2rem}
.intv-label{font-size:.65rem;color:rgba(255,255,255,.3);font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;white-space:nowrap}
input[type=range]{flex:1;accent-color:#c4933f;height:3px;cursor:pointer}
.intv-val{font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:500;color:#d4a84f;min-width:36px;text-align:right}

/* Announcement */
.ann-area{background:#0d0d0f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1rem 1rem .85rem;margin-bottom:.75rem}
.ann-area label{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.2);font-family:'IBM Plex Mono',monospace;display:block;margin-bottom:.55rem}
.ann-area textarea{width:100%;background:transparent;border:none;color:rgba(255,255,255,.75);font-family:'DM Sans',sans-serif;font-size:.82rem;resize:none;min-height:58px;line-height:1.5}
.ann-area textarea:focus{outline:none}
.ann-area textarea::placeholder{color:rgba(255,255,255,.18)}
.ann-area .from-input{width:100%;background:transparent;border:none;border-top:1px solid rgba(255,255,255,.05);padding-top:.55rem;margin-top:.45rem;color:rgba(255,255,255,.4);font-family:'DM Sans',sans-serif;font-size:.72rem}
.ann-area .from-input:focus{outline:none}
.ann-area .from-input::placeholder{color:rgba(255,255,255,.15)}
.dur-row{display:flex;gap:.4rem;margin-bottom:.7rem;flex-wrap:wrap}
.dur-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.28rem .65rem;font-size:.62rem;cursor:pointer;color:rgba(255,255,255,.35);font-family:'IBM Plex Mono',monospace;transition:all .15s}
.dur-btn.active{background:rgba(42,110,124,.2);border-color:rgba(74,157,173,.4);color:#4a9dad}
.send-btn{width:100%;background:linear-gradient(135deg,#c4933f,#d4a84f);border:none;border-radius:11px;padding:.75rem;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.06em;box-shadow:0 4px 12px rgba(196,147,63,.3),inset 0 1px 0 rgba(255,255,255,.2);transition:all .12s}
.send-btn:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(196,147,63,.2)}
.clear-btn{width:100%;background:transparent;border:1px solid rgba(220,38,38,.2);border-radius:11px;padding:.55rem;color:rgba(255,100,100,.45);font-size:.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:.5rem;transition:all .15s}
.clear-btn:active{background:rgba(220,38,38,.1);color:#fca5a5}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.4rem}
.stat-mini{background:#0d0d0f;border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:.6rem .4rem;text-align:center}
.sm-n{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;line-height:1}
.sm-l{font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:.15rem;font-family:'IBM Plex Mono',monospace}
.refresh-btn{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;color:rgba(255,255,255,.3);font-size:.65rem;padding:.4rem;cursor:pointer;font-family:'IBM Plex Mono',monospace;margin-top:.5rem;transition:all .15s}
.refresh-btn:active{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}

/* Toast */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(12px);background:#1c2330;border:1px solid rgba(255,255,255,.1);color:#e2e8f0;padding:.5rem 1.2rem;border-radius:25px;font-size:.72rem;z-index:200;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Brand pill */
.remote-top{display:flex;justify-content:center;margin-bottom:1.4rem}
.remote-pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:.3rem .9rem;font-family:'Cormorant Garamond',serif;font-size:.85rem;font-weight:300;color:rgba(255,255,255,.35);letter-spacing:.08em}
.remote-pill em{font-style:italic;color:rgba(196,147,63,.5)}
</style>
</head>
<body>
<div class="remote">

  <div class="remote-top">
    <div class="remote-pill">Tanvi <em>&amp;</em> Justin · TV Remote</div>
  </div>

  <div class="display">
    <div class="disp-eyebrow">Now showing</div>
    <div class="disp-scene" id="disp-scene">⏳ <em>Countdown</em></div>
    <div class="disp-row">
      <div class="disp-stat" id="disp-stat">— guests · —%</div>
      <div class="disp-live"><span class="live-dot"></span>LIVE</div>
    </div>
  </div>

  <div class="section-label">Scene</div>
  <div class="scenes">
    <button class="scene-btn active" data-scene="0" onclick="setScene(0)">
      <span class="sb-icon">⏳</span><span class="sb-name">Countdown</span><span class="sb-sub">Wedding timer</span>
    </button>
    <button class="scene-btn" data-scene="1" onclick="setScene(1)">
      <span class="sb-icon">👥</span><span class="sb-name">Guests</span><span class="sb-sub">RSVP stats</span>
    </button>
    <button class="scene-btn" data-scene="2" onclick="setScene(2)">
      <span class="sb-icon">🗓</span><span class="sb-name">Events</span><span class="sb-sub">Schedule</span>
    </button>
    <button class="scene-btn" data-scene="3" onclick="setScene(3)">
      <span class="sb-icon">✈️</span><span class="sb-name">Travel</span><span class="sb-sub">How to get there</span>
    </button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" onclick="navScene(-1)">← Prev</button>
    <button class="nav-btn" onclick="navScene(1)">Next →</button>
  </div>

  <div class="phy-divider"></div>

  <div class="section-label">Auto-advance</div>
  <div class="autoplay-row">
    <span class="ap-label" id="ap-label">Slide auto-advance</span>
    <label class="toggle">
      <input type="checkbox" id="autoplay-toggle" checked onchange="setAutoPlay(this.checked)"/>
      <div class="tgl-track"></div>
      <div class="tgl-thumb"></div>
    </label>
  </div>
  <div class="interval-row">
    <span class="intv-label">Every</span>
    <input type="range" id="interval-range" min="5" max="60" step="5" value="12" oninput="updateInterval(this.value)"/>
    <span class="intv-val" id="interval-val">12s</span>
  </div>

  <div class="phy-divider"></div>

  <div class="section-label">Announcement</div>
  <div class="ann-area">
    <label>Message</label>
    <textarea id="ann-text" placeholder="e.g. Dinner is served! 🍽️" rows="3"></textarea>
    <input class="from-input" type="text" id="ann-from" placeholder="From: Wedding Team"/>
  </div>
  <div class="dur-row">
    <button class="dur-btn active" data-dur="10" onclick="selectDur(this)">10s</button>
    <button class="dur-btn" data-dur="15" onclick="selectDur(this)">15s</button>
    <button class="dur-btn" data-dur="20" onclick="selectDur(this)">20s</button>
    <button class="dur-btn" data-dur="30" onclick="selectDur(this)">30s</button>
    <button class="dur-btn" data-dur="60" onclick="selectDur(this)">60s</button>
  </div>
  <button class="send-btn" onclick="sendAnnouncement()">📢 Send to TV</button>
  <button class="clear-btn" onclick="clearAnnouncement()">✕ Clear announcement</button>

  <div class="phy-divider"></div>

  <div class="section-label">Guests</div>
  <div class="stats-grid">
    <div class="stat-mini"><div class="sm-n" id="s-conf" style="color:#12a48c">—</div><div class="sm-l">Yes</div></div>
    <div class="stat-mini"><div class="sm-n" id="s-pend" style="color:#8b5cf6">—</div><div class="sm-l">Pending</div></div>
    <div class="stat-mini"><div class="sm-n" id="s-decl" style="color:#e85d3c">—</div><div class="sm-l">No</div></div>
    <div class="stat-mini"><div class="sm-n" id="s-total" style="color:#d4a84f">—</div><div class="sm-l">Total</div></div>
    <div class="stat-mini"><div class="sm-n" id="s-pax" style="color:#4a9dad">—</div><div class="sm-l">Pax</div></div>
    <div class="stat-mini"><div class="sm-n" id="s-pct" style="color:#fbbf24">—%</div><div class="sm-l">RSVP%</div></div>
  </div>
  <button class="refresh-btn" onclick="loadStats()">↻ refresh stats</button>

</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCoXMPGLlPn56oKYnWX6iHuJOlJYPlyUV8",authDomain:"tanvi-and-justin.firebaseapp.com",projectId:"tanvi-and-justin",storageBucket:"tanvi-and-justin.firebasestorage.app",messagingSenderId:"418808308001",appId:"1:418808308001:web:730d002e16f82327f5de60"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let currentScene=0,selectedDur=10;
const SCENE_DISPLAY=['⏳ <em>Countdown</em>','👥 <em>Guest Stats</em>','🗓 <em>Events</em>','✈️ <em>Travel</em>'];
const SCENE_NAMES=['⏳ Countdown','👥 Guest Stats','🗓 Events','✈️ Travel'];

loadStats();
watchTv();

function watchTv(){
  db.collection('liveOps').doc('tvDisplay').onSnapshot(snap=>{
    if(!snap.exists)return;
    const d=snap.data();
    if(typeof d.scene==='number'){currentScene=d.scene;updateSceneUI();}
    if(typeof d.autoPlay==='boolean'){document.getElementById('autoplay-toggle').checked=d.autoPlay;updateApLabel(d.autoPlay);}
    if(d.interval){document.getElementById('interval-range').value=d.interval;document.getElementById('interval-val').textContent=d.interval+'s';}
  },()=>{});
}

function updateSceneUI(){
  document.querySelectorAll('.scene-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.scene)===currentScene));
  document.getElementById('disp-scene').innerHTML=SCENE_DISPLAY[currentScene]||'Scene '+(currentScene+1);
}
function updateApLabel(on){document.getElementById('ap-label').textContent=on?'Auto-advance ON':'Auto-advance OFF';}

async function setScene(idx){
  currentScene=idx;updateSceneUI();
  try{await db.collection('liveOps').doc('tvDisplay').set({scene:idx},{merge:true});toast('📺 '+SCENE_NAMES[idx]);}
  catch(e){toast('Error');}
}
function navScene(dir){setScene(((currentScene+dir)+4)%4);}

async function setAutoPlay(val){
  updateApLabel(val);
  try{await db.collection('liveOps').doc('tvDisplay').set({autoPlay:val},{merge:true});toast(val?'▶ Auto-advance ON':'⏸ Paused');}
  catch(e){}
}
async function updateInterval(val){
  document.getElementById('interval-val').textContent=val+'s';
  try{await db.collection('liveOps').doc('tvDisplay').set({interval:parseInt(val)},{merge:true});}catch(e){}
}
function selectDur(btn){
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');selectedDur=parseInt(btn.dataset.dur);
}
async function sendAnnouncement(){
  const text=document.getElementById('ann-text').value.trim();
  const from=document.getElementById('ann-from').value.trim()||'Wedding Team';
  if(!text){toast('Write a message first!');return;}
  try{
    await db.collection('liveOps').doc('tvDisplay').set({announcement:text,announcementFrom:from,dismissAfter:selectedDur,announcedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    document.getElementById('ann-text').value='';toast('📢 Sent!');
  }catch(e){toast('Error: '+e.message);}
}
async function clearAnnouncement(){
  try{await db.collection('liveOps').doc('tvDisplay').set({announcement:'',announcementFrom:''},{merge:true});toast('✓ Cleared');}catch(e){}
}
async function loadStats(){
  try{
    const snap=await db.collection('guests').get();
    let conf=0,pend=0,decl=0,pax=0;
    snap.forEach(doc=>{const d=doc.data();if(d.attendance==='yes'){conf++;pax+=(d.guests||1);}else if(d.attendance==='no')decl++;else pend++;});
    const total=snap.size,pct=total>0?Math.round(((conf+decl)/total)*100):0;
    document.getElementById('s-conf').textContent=conf;document.getElementById('s-pend').textContent=pend;
    document.getElementById('s-decl').textContent=decl;document.getElementById('s-total').textContent=total;
    document.getElementById('s-pax').textContent=pax;document.getElementById('s-pct').textContent=pct+'%';
    document.getElementById('disp-stat').textContent=total+' guests · '+pct+'% RSVP';
  }catch(e){}
}
function toast(msg,dur=2200){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
</script>
</body>
</html>
